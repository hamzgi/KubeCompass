apiVersion: v1
kind: Namespace
metadata:
  name: kubecompass-demo
  labels:
    app.kubernetes.io/part-of: kubecompass
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-web
  namespace: kubecompass-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: kubecompass-demo
  labels:
    app.kubernetes.io/name: demo-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-web
    spec:
      serviceAccountName: demo-web
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: kubecompass-demo
spec:
  selector:
    app.kubernetes.io/name: demo-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: security-lab
  namespace: kubecompass-demo
  labels:
    app.kubernetes.io/name: security-lab
    kubecompass.io/purpose: security-demo
spec:
  containers:
    - name: security-lab
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true
